name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Let expensive platform regression suites finish and populate their caches.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with the Liquid Glass SDK
        if: runner.os == 'macOS'
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - name: Use Strawberry Perl
        if: runner.os == 'Windows'
        run: echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      # Vendored OpenSSL (for SQLCipher) needs Perl; Windows runners ship Strawberry Perl.
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy -p kurogane-core -p kurogane-sync -p kurogane-cli --all-targets -- -D warnings
      - run: cargo test -p kurogane-core -p kurogane-sync -p kurogane-cli

  ui:
    name: UI (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    name: Desktop shell (${{ matrix.os }})
    needs: [ui]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with the Liquid Glass SDK
        if: runner.os == 'macOS'
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - name: Use Strawberry Perl
        if: runner.os == 'Windows'
        run: echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build -p kurogane-app --features custom-protocol --release
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - name: Native SwiftUI integration smoke
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          mkdir -p native-integration
          KUROGANE_NATIVE_SMOKE_DIR="$PWD/native-integration" cargo run -p kurogane-app --features custom-protocol,native-smoke --release
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: native-bridge-review
          path: native-integration/*.png
          if-no-files-found: error
