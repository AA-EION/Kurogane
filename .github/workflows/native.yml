name: Native SwiftUI verification
# Runs as part of parity.yml (on every push), next to the Linux and Windows
# captures; it can also be started on its own.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
      - name: Typecheck both native architectures
        run: |
          for arch in arm64 x86_64; do
            xcrun swiftc -D NATIVE_SMOKE -typecheck -whole-module-optimization -target "$arch-apple-macosx13.0" -sdk "$(xcrun --sdk macosx --show-sdk-path)" src-tauri/macos/*.swift
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build and serve the shared graph
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          node ui/node_modules/vite/bin/vite.js preview ui --host 127.0.0.1 --port 1420 >/tmp/kurogane-graph.log 2>&1 &
      - name: Native layout and validation checks
        run: |
          xcrun swiftc -D NATIVE_PREVIEW -parse-as-library -target arm64-apple-macosx13.0 src-tauri/macos/*.swift src-tauri/tests/NativePreview.swift -o /tmp/kurogane-native-preview
          for fixture in demo-topology multi-company; do
            mkdir -p "native-screenshots/$fixture"
            KUROGANE_NATIVE_GRAPH_URL=http://127.0.0.1:1420 /tmp/kurogane-native-preview "$PWD/native-screenshots/$fixture" "$PWD/ui/src/graph/__fixtures__/$fixture.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-ui-review
          path: native-screenshots/**/*.png
          if-no-files-found: error
