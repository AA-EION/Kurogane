name: Platform parity

# The same UI checks and screenshots on Linux, macOS and Windows:
#  - browser: Playwright end-to-end tests against the development backend, in
#    Chromium and in the engine behind each platform's desktop webview
#    (WebKit for WKWebView/WebKitGTK, Microsoft Edge for WebView2).
#  - desktop: the real app (Rust core, encrypted demo vault, platform webview)
#    unlocked and driven through one scenario with tauri-driver on Linux
#    (WebKitWebDriver, WebKitGTK) and Windows (Edge WebDriver, WebView2).
#  - macos-native: the SwiftUI shell around the same graph in WKWebView.
#  - gallery: every capture side by side in one artifact.

on:
  push:
    branches: [main, 'codex/**', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  # Like ci.yml: let the expensive desktop builds finish and populate their caches.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Public test value for the throwaway demo vault created in this workflow.
  KG_PARITY_PASSWORD: parity-demo-password

jobs:
  browser:
    name: UI e2e · ${{ matrix.label }} (${{ matrix.engines }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux, engines: 'chromium,webkit' }
          - { os: macos-latest, label: macos, engines: 'chromium,webkit' }
          - { os: windows-latest, label: windows, engines: 'chromium,msedge' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Install browser engines
        run: |
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium webkit
          elif [ "$RUNNER_OS" = macOS ]; then npx playwright install chromium webkit
          else npx playwright install chromium; fi
      - run: npm run e2e
        env:
          CI: 'true'
          KG_E2E_ENGINES: ${{ matrix.engines }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.label }}
          path: |
            ui/e2e-screenshots
            ui/e2e-report
            ui/e2e-results
          if-no-files-found: error

  desktop:
    name: Desktop app · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux, bin: kurogane-desktop }
          - { os: windows-latest, label: windows, bin: kurogane-desktop.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - name: Use Strawberry Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: parity-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux WebKit, WebDriver and display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev webkit2gtk-driver xvfb
      - name: Edge WebDriver matching the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}'
          $ver = ($keys | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1)
          if (-not $ver) { throw 'No WebView2 runtime version found' }
          Write-Host "WebView2 runtime $ver"
          $ok = $false
          foreach ($u in "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip", "https://msedgedriver.azureedge.net/$ver/edgedriver_win64.zip") {
            try { Invoke-WebRequest $u -OutFile edgedriver.zip; $ok = $true; break } catch { Write-Host "Could not download $u" }
          }
          if (-not $ok) { throw "No Edge WebDriver for $ver" }
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          echo "KG_NATIVE_DRIVER=$pwd\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV
      - run: cargo install tauri-driver --locked
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: Build the desktop app and the demo-vault tool
        run: |
          cargo build -p kurogane-app --features custom-protocol --release
          cargo build -p kurogane-cli --features demo-seed --release
      - name: Create the encrypted demo vault
        env:
          KUROGANE_HOME: ${{ runner.temp }}/kurogane-home
          KUROGANE_PASSWORD: ${{ env.KG_PARITY_PASSWORD }}
        run: |
          target/release/kurogane demo-vault "$RUNNER_TEMP/demo.kurogane"
          target/release/kurogane unlock "$RUNNER_TEMP/demo.kurogane" --json > "$RUNNER_TEMP/topology.json"
      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Evidence for the WebDriver run: does the app start, stay up and paint a window?
          New-Item -ItemType Directory -Force desktop-screenshots/windows | Out-Null
          $app = Start-Process -FilePath "target/release/${{ matrix.bin }}" -ArgumentList "`"$env:RUNNER_TEMP\demo.kurogane`"" -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("desktop-screenshots/windows/00-launch-check.png")
          Get-Process | Where-Object { $_.ProcessName -match 'kurogane|msedgewebview2' } | Format-Table ProcessName, Id, MainWindowTitle -AutoSize | Out-String | Tee-Object desktop-screenshots/windows/launch-processes.txt
          Write-Host "app exited: $($app.HasExited) code: $(if ($app.HasExited) { $app.ExitCode })"
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Drive the real app
        run: |
          cmd=(node ui/e2e/desktop.mjs --app "target/release/${{ matrix.bin }}" --vault "$RUNNER_TEMP/demo.kurogane" \
               --password-env KG_PARITY_PASSWORD --topology "$RUNNER_TEMP/topology.json" --out desktop-screenshots/${{ matrix.label }})
          if [ -n "${KG_NATIVE_DRIVER:-}" ]; then cmd+=(--native-driver "$KG_NATIVE_DRIVER"); fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1600x1000x24" "${cmd[@]}"; else "${cmd[@]}"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.label }}
          path: desktop-screenshots
          if-no-files-found: error

  macos-native:
    name: macOS native shell
    uses: ./.github/workflows/native.yml

  gallery:
    name: Side-by-side gallery
    needs: [browser, desktop, macos-native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: captures
      - run: node scripts/parity-gallery.mjs captures parity-gallery
      - uses: actions/upload-artifact@v4
        with:
          name: parity-gallery
          path: parity-gallery
          if-no-files-found: error
