name: Installers

# Builds the installers for all three platforms:
#   Windows  → Kurogane_<version>_x64-setup.exe   (NSIS, per-user install)
#   macOS    → Kurogane_<version>_universal.dmg   (drag Kurogane.app to Applications; ad-hoc signed)
#   Linux    → Kurogane_<version>_amd64.AppImage
#
# Push a tag like `v0.2.0` to publish them as a draft GitHub release.
# Any other run (manual, or a change to the packaging config) only uploads
# them as workflow artifacts.

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/icons/**
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.exe)
            os: windows-latest
            args: --bundles nsis
            artifacts: target/release/bundle/nsis/*.exe
          - name: macOS (.dmg, universal)
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifacts: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux (.AppImage)
            # Oldest supported runner → the AppImage runs on older glibc too.
            os: ubuntu-22.04
            args: --bundles appimage
            artifacts: target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: installers

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf file

      # Vendored OpenSSL (SQLCipher) needs NASM on Windows; Strawberry Perl is preinstalled.
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      # Runs `npm run build` in ui/ first (beforeBuildCommand), then cargo and the bundler.
      - name: Build installer
        shell: bash
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build ${{ matrix.args }}

      - name: Smoke-test the AppImage
        if: runner.os == 'Linux'
        run: |
          app=$(ls target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          "$app" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/kurogane-desktop
          ldd squashfs-root/usr/bin/kurogane-desktop | (! grep "not found")

      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Kurogane.app
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -info "$app/Contents/MacOS/kurogane-desktop"

      - uses: actions/upload-artifact@v4
        with:
          name: kurogane-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist && (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Kurogane ${{ github.ref_name }}
          files: dist/*
          body: |
            **Windows** — run `Kurogane_*_x64-setup.exe`. It installs per-user, so no admin rights are needed. SmartScreen may warn because the installer is not code-signed yet: choose *More info → Run anyway*.

            **macOS** — open `Kurogane_*_universal.dmg` and drag **Kurogane** onto **Applications**. The app is ad-hoc signed, not notarized, so the first time either right-click it and choose *Open*, or run `xattr -dr com.apple.quarantine /Applications/Kurogane.app`.

            **Linux** — `chmod +x Kurogane_*.AppImage` and run it.

            Check downloads against `SHA256SUMS.txt`.
