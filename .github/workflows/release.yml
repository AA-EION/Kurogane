name: Build artifacts (no release)

# Builds the installers for all three platforms:
#   Windows  → Kurogane_<version>_x64-setup.exe   (NSIS, per-user install)
#   macOS    → Kurogane_<version>_universal.dmg   (drag Kurogane.app to Applications; ad-hoc signed)
#   Linux    → Kurogane_<version>_amd64.AppImage
#
# This workflow uploads installers as workflow artifacts only.
# Release creation and publication are intentionally absent.

on:
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-source:
    name: Exact dependency source archives
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/license-audit.mjs --check
      - run: node scripts/archive-dependency-source.mjs
      - run: tar -czf kurogane-dependency-source.tar.gz dependency-source
      - uses: actions/upload-artifact@v4
        with:
          name: kurogane-dependency-source
          path: kurogane-dependency-source.tar.gz
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.exe)
            os: windows-latest
            args: --bundles nsis
            artifacts: target/release/bundle/nsis/*.exe
          - name: macOS (.dmg, universal)
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifacts: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux (.AppImage)
            # Oldest supported runner → the AppImage runs on older glibc too.
            os: ubuntu-22.04
            args: --bundles appimage
            artifacts: target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode with the Liquid Glass SDK
        if: runner.os == 'macOS'
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcrun swiftc --version
          xcrun swiftc -typecheck -target arm64-apple-macosx13.0 -sdk "$(xcrun --sdk macosx --show-sdk-path)" src-tauri/macos/*.swift

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: installers

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf file

      # Vendored OpenSSL (SQLCipher) needs NASM and a full Perl on Windows.
      # Git Bash's MSYS perl lacks modules OpenSSL's Configure uses, so pin Strawberry Perl.
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        run: echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV

      # Runs `npm run build` in ui/ first (beforeBuildCommand), then cargo and the bundler.
      - name: UI verification
        run: node node_modules/vitest/vitest.mjs run
        working-directory: ui

      - name: Verify dependency licenses
        run: node scripts/license-audit.mjs --check

      - name: Collect distro notices for the Linux bundle
        if: runner.os == 'Linux'
        run: python3 scripts/linux-license-audit.py prepare

      - name: Build installer
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build ${{ matrix.args }}

      - name: Archive exact project source
        shell: bash
        run: git archive --format=tar.gz --output=kurogane-source.tar.gz HEAD

      - name: Smoke-test the AppImage
        if: runner.os == 'Linux'
        run: |
          app=$(ls target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          "$app" --appimage-version > appimage-runtime-version.txt 2>&1
          node -e 'const fs=require("fs"); const reviewed=require("./docs/legal/appimage-source-inventory.json"); if(fs.readFileSync("appimage-runtime-version.txt","utf8").trim()!==reviewed.runtimeVersion) throw Error("AppImage runtime changed: source and license audit required")'
          "$app" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/kurogane-desktop
          ldd squashfs-root/usr/bin/kurogane-desktop | (! grep "not found")
          python3 scripts/linux-license-audit.py inspect --appdir squashfs-root

      - name: Preserve platform inventory even when source download fails
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: kurogane-platform-license-evidence
          path: |
            platform-license-manifest.json
            platform-source-packages.txt
            appimage-runtime-version.txt

      - name: Platform license and source evidence
        if: runner.os == 'Linux'
        run: |
          sudo sh -c "grep '^deb ' /etc/apt/sources.list | sed 's/^deb /deb-src /' > /etc/apt/sources.list.d/kurogane-source.list"
          sudo apt-get update
          mkdir -p platform-source
          cd platform-source
          while IFS= read -r package; do apt-get source --download-only "$package"; done < ../platform-source-packages.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kurogane-source-${{ runner.os }}
          path: |
            kurogane-source.tar.gz
            platform-license-manifest.json
            platform-source-packages.txt
            platform-source/

      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Kurogane.app
          test -s "$app/Contents/Resources/legal/LICENSE"
          test -s "$app/Contents/Resources/legal/THIRD_PARTY_LICENSES.txt"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -info "$app/Contents/MacOS/kurogane-desktop"

      - uses: actions/upload-artifact@v4
        with:
          name: kurogane-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
