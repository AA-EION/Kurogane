[workspace]
resolver = "2"
members = [
    "crates/kurogane-core",
    "crates/kurogane-sync",
    "crates/kurogane-cli",
    "src-tauri",
]
# `cargo test` at the root builds everything that does not need the WebKit/GTK
# toolchain. Build the desktop shell explicitly with `cargo build -p kurogane-app`.
default-members = [
    "crates/kurogane-core",
    "crates/kurogane-sync",
    "crates/kurogane-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/AA-EION/Kurogane"

[workspace.dependencies]
kurogane-core = { path = "crates/kurogane-core" }
kurogane-sync = { path = "crates/kurogane-sync" }

aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
getrandom = "0.2"
zeroize = { version = "1.8", features = ["derive", "serde"] }
region = "3"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
data-encoding = "2.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
which = "7"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fd-lock = "4"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
arboard = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
