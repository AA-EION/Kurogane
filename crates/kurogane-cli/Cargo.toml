[package]
name = "kurogane-cli"
description = "Headless Kurogane: vault creation/inspection, fixture export and sync manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kurogane"
path = "src/main.rs"

[features]
# Dev tooling: `kurogane demo-fixture` regenerates the UI test fixture.
demo-seed = ["kurogane-core/demo-seed"]

[dependencies]
kurogane-core.workspace = true
kurogane-sync.workspace = true
anyhow.workspace = true
clap.workspace = true
rpassword.workspace = true
serde_json.workspace = true
qrcode = { version = "0.14", default-features = false }
zeroize.workspace = true
